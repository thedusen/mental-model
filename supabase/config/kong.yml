_format_version: "1.1"

consumers:
  - username: anon
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOuoJN_mz4WnKu11FU3gZoD6p8LTOgXhHO6M
  - username: service_role
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: service_role

services:
  - name: auth-v1-open
    url: http://supabase-auth:9999/
    plugins:
      - name: cors
  - name: auth-v1-open-confirm
    url: http://supabase-auth:9999/confirm
    plugins:
      - name: cors
  - name: auth-v1-open-signup
    url: http://supabase-auth:9999/signup
    plugins:
      - name: cors

routes:
  - service: auth-v1-open
    strip_path: true
    paths:
      - "/auth/v1"
  - service: auth-v1-open-confirm  
    strip_path: true
    paths:
      - "/auth/v1/confirm"
  - service: auth-v1-open-signup
    strip_path: true  
    paths:
      - "/auth/v1/signup"

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - HEAD  
        - PUT
        - PATCH
        - POST
        - DELETE
      headers:
        - Accept
        - Accept-Encoding
        - Authorization
        - Content-Encoding
        - Content-Length
        - Content-Type
        - Date
        - Host
        - X-Forwarded-For
        - X-Forwarded-Proto
        - X-Forwarded-Host